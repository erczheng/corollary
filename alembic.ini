# Alembic configuration.
#
# `sqlalchemy.url` is deliberately left blank. env.py falls back to
# `corollary.db.session.database_url()`, so there is exactly one definition of
# where the database lives and no chance of a path in a checked-in file
# disagreeing with the one the engine opens. Tests override it in-process via
# `Config.set_main_option`.

[alembic]
script_location = corollary/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Timestamped, ordered revision filenames, so `ls versions/` reads as history.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
