[project]
name = "corollary"
version = "0.1.0"
description = "Single-user equity options trading terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "duckdb>=1.1",
    "tzdata>=2024.2",
    "exchange-calendars>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "time-machine>=2.15",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corollary"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "risk: risk manager tests — run before any change to the engine",
]

[tool.mypy]
python_version = "3.12"
strict = true
