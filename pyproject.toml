[project]
name = "corollary"
version = "0.1.0"
description = "Single-user equity options trading terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "duckdb>=1.1",
    "tzdata>=2024.2",
    "exchange-calendars>=4.5",
    # Promoted from the dev group in Phase 2 step 3. `httpx` is now the
    # Alpaca transport, not just a test client -- see the module docstring of
    # corollary/data/providers/alpaca.py for why the vendor SDK was not used.
    "httpx>=0.27",
    # Declared directly in step 8d part 2, though it already arrived through
    # `uvicorn[standard]`. The vendor websocket clients import it, so it is a
    # dependency of the engine and not of the server: an install that dropped
    # the `standard` extra would take the market-data sockets with it.
    "websockets>=13",
    # Alpaca's option stream is msgpack **only** -- "unlike the stock and
    # crypto stream, the option stream is only available in msgpack format".
    # Not a preference, so not optional.
    "msgpack>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "time-machine>=2.15",
    "mypy>=1.13",
    # Used only by the one-shot recorders under tests/fixtures/ --
    # record_alpaca.py and record_finnhub.py -- which capture live vendor
    # responses into tests/fixtures/<vendor>/. Nothing under corollary/ reads
    # .env directly; the process environment is the engine's input.
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corollary"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "risk: money-safety tests — rule 9's dead-man's switch today, RiskManager's limits when it lands. Run before any change to the engine.",
]
# Strict, not auto: an async test without @pytest.mark.asyncio should fail
# loudly rather than be silently collected and skipped. Same reasoning as
# --strict-markers above.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# `exchange_calendars` ships no `py.typed` marker, so mypy refuses to look
# inside it. It is reached from exactly one place -- `corollary/calendars.py`,
# which materialises the session closes into a `dict[date, datetime]` on first
# use -- so the untyped surface is one call and one loop, and everything
# downstream of it is annotated.
module = ["exchange_calendars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `msgpack` ships no `py.typed` marker. It is reached from exactly two places
# -- `corollary/wire.py`'s `decode_msgpack`, which returns `Any` and converts
# every float on the way out, and `corollary/sockets.py`'s `Codec.encode` --
# so the untyped surface is one `unpackb` and one `packb`, and everything
# downstream of either is annotated. Same shape of exception as
# `exchange_calendars` above.
module = ["msgpack.*"]
ignore_missing_imports = true
